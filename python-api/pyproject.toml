[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcrho-api"
version = "0.2.1"
description = "Python API for scripting ArcRho project and DFM workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Xiao Wei" }
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/arcrho_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/arcrho_project_duplication_contract.py" = "arcrho_project_duplication_contract.py"
