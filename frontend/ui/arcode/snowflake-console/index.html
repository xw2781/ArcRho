<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260811a"></script>
  <title>Snowflake SQL</title>
  <link rel="stylesheet" href="/ui/arcode/shared/scrollbars.css?v=20260516a"/>
  <link rel="stylesheet" href="/ui/arcode/snowflake-console/snowflake-console.css?v=20260618a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260811a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260811b"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/high_contrast.css?v=20260811c"/>
</head>
<body>
  <main class="sfApp">
    <header class="sfToolbar">
      <select id="connectionSelect" class="sfSelect" aria-label="Snowflake connection"></select>
      <button id="testConnectionBtn" class="sfBtn" type="button">Test</button>
      <button id="saveBtn" class="sfBtn" type="button">Save</button>
      <button id="formatBtn" class="sfBtn" type="button" aria-busy="false">Format</button>
      <button id="runBtn" class="sfBtn primary" type="button">Run</button>
      <span id="statusText" class="sfStatus">Ready</span>
    </header>

    <section class="sfMetaBar" aria-label="Connection details">
      <span id="roleChip" class="sfChip">Role</span>
      <span id="warehouseChip" class="sfChip">Warehouse</span>
      <span id="databaseChip" class="sfChip">Database</span>
      <span id="schemaChip" class="sfChip">Schema</span>
    </section>

    <section id="editorHost" class="sfEditorHost" aria-label="SQL editor"></section>

    <section class="sfResults" aria-label="Query results">
      <div class="sfResultsHeader">
        <span id="resultsTitle">Results</span>
        <span id="queryInfo" class="sfQueryInfo"></span>
      </div>
      <div id="messageBox" class="sfMessage">Run a query to see results.</div>
      <div id="tableWrap" class="sfTableWrap"></div>
    </section>
  </main>

  <script src="/ui/libs/monaco-editor/min/vs/loader.js"></script>
  <script src="/ui/arcode/shared/zoom_bridge.js?v=20260614a"></script>
  <script type="module" src="/ui/arcode/snowflake-console/index.js?v=20260726a"></script>
</body>
</html>
