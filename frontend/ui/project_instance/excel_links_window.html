<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260811a"></script>
  <title>Manage Excel Links</title>
  <link rel="stylesheet" href="/ui/shared/styles/scrollbars.css?v=20260516a"/>
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260811b"/>
  <link rel="stylesheet" href="/ui/shared/styles/pi_table.css?v=20260819a"/>
  <link rel="stylesheet" href="/ui/project_instance/excel_links_window.css?v=20260918c"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260817d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260916a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/high_contrast.css?v=20260811c"/>
</head>
<body class="pi-excel-links-page">
  <div class="pi-excel-links-body">
    <div class="pi-excel-links-content">
      <div class="pi-excel-links-toolbar">
        <span class="pi-excel-links-cue">Click a row to select it, right-click for workbook actions. Click a name to open it, a header to sort.</span>
        <div class="pi-excel-links-tools">
          <span class="pi-excel-links-working" id="excelLinksWorking" hidden aria-live="polite">
            <span class="pi-excel-links-spinner" aria-hidden="true"></span>
            <span id="excelLinksWorkingText"></span>
          </span>
          <button class="pi-excel-links-btn primary" id="excelLinksRefreshAll" type="button" title="Refresh every dataset and DFM method whose linked values changed" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <use href="/ui/shared/icons/reload.svg?v=20260823b#reload"></use>
            </svg>
            <span>Refresh all</span>
          </button>
        </div>
      </div>
      <div class="pi-excel-links-table-wrap" id="excelLinksTableWrap">
        <table class="pi-excel-links-table" id="excelLinksTable" aria-multiselectable="true"></table>
        <div class="pi-excel-links-state" id="excelLinksState" hidden></div>
      </div>
      <div class="pi-excel-links-status" id="excelLinksStatus" aria-live="polite"></div>
    </div>
  </div>
  <div class="ctx-menu pi-excel-links-menu" id="excelLinksMenu" role="menu" aria-label="Excel link actions">
    <div class="ctx-menu-inner">
      <button class="ctx-item" type="button" role="menuitem" data-action="open-object">Open dataset</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="copy-name">Copy name</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="open-workbook">Open workbook</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="open-workbook-read-only">Open workbook as Read-Only</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="open-folder">Open file location</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="copy-path">Copy path</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" type="button" role="menuitem" data-action="refresh-links">Refresh link</button>
      <button class="ctx-item" type="button" role="menuitem" data-action="change-link">Change Link...</button>
      <button class="ctx-item danger" type="button" role="menuitem" data-action="break-links">Break link</button>
    </div>
  </div>
  <div class="pi-excel-links-filter-popover" id="excelLinksFilterPopover" role="dialog" aria-label="Column filter"></div>
  <script type="module" src="/ui/project_instance/excel_links_window.js?v=20260918c"></script>
</body>
</html>
