  <title>Project Instance</title>

  <style>
    :root {
      --border: #d9dee8;
      --text: #20242a;

      flex-direction: column;
      min-height: 0;
      position: relative;

    .pi-add-picker-resize[data-edge="s"] {
      bottom: -3px;
    }
    .pi-add-picker-resize[data-edge="e"],
    .pi-add-picker-resize[data-edge="w"] {
      top: 8px;
      bottom: 8px;

    .pi-add-picker-resize[data-edge="e"] {
      right: -3px;
    }
    .pi-add-picker-resize[data-edge="w"] {
      left: -3px;

      height: 14px;

      top: -4px;
      right: -4px;
      cursor: nesw-resize;
    }
    .pi-add-picker-resize[data-edge="nw"] {
      top: -4px;
      left: -4px;
      cursor: nwse-resize;
    }
    .pi-add-picker-resize[data-edge="se"] {
      right: -4px;
      bottom: -4px;
      cursor: nwse-resize;
    }
    .pi-add-picker-resize[data-edge="sw"] {
      left: -4px;
      bottom: -4px;

    .pi-table-filter-popover {

      height: 13px;

    .pi-window-layer {

      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .pi-window {

      min-height: 280px;
      background: #fff;
      border: 1px solid #aeb8ca;
      border-radius: 6px;
      box-shadow: var(--shadow);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .pi-window.active {
      border-color: #2f6fec;
      box-shadow: 0 0 0 2px rgba(47, 111, 236, 0.18), 0 14px 34px rgba(27, 40, 66, 0.24);
    }
    body.win11-frame .pi-window {
      border-radius: 8px;
    }
    .pi-window-titlebar {
      height: 30px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 10px;
      border-bottom: 1px solid #c9d1df;
      background: #f0f3f8;
      cursor: move;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    .pi-window.active .pi-window-titlebar {
      background: #e7f0ff;
      border-bottom-color: #9bbcf7;
      color: #13294b;
    }
    body.win11-frame .pi-window-titlebar {
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }
    .pi-window-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }
    .pi-window-dirty {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #e11d48;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.12);
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .pi-window.dirty .pi-window-dirty {
      opacity: 1;
      transform: scale(1);
    }
    .pi-window-titlebar-controls {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pi-window-titlebar-btn {
      width: 28px;
      height: 20px;
      border: 1px solid #bdbdbd;
      border-radius: 4px;
      background: #efefef;
      color: #333;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .pi-window-titlebar-btn:hover {
      background: #e2e2e2;
    }
    .pi-window-titlebar-btn:active {
      background: #d8d8d8;
    }
    .pi-window-minimize:hover,
    .pi-window-maximize:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }
    .pi-window-close:hover {
      background: #fee2e2;
      border-color: #fca5a5;
    }
    .pi-window-titlebar-icon {
      width: 10px;
      height: 10px;
      stroke: #333;
      stroke-width: 1.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .pi-window-body {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    .pi-window-body iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    .pi-window-resize {
      position: absolute;
      width: 16px;
      height: 16px;
    }
    .pi-window-resize-ne,
    .pi-window-resize-se,
    .pi-window-resize-sw,
    .pi-window-resize-nw {
      width: 16px;
      height: 16px;
    }
    .pi-window-resize-edge {
      z-index: 1;
    }
    .pi-window-resize-nw {
      left: 0;
      top: 0;
      cursor: nwse-resize;
    }
    .pi-window-resize-n {
      left: 16px;
      right: 16px;
      top: 0;
      width: auto;
      height: 8px;
      cursor: ns-resize;
    }
    .pi-window-resize-ne {
      right: 0;
      top: 0;
      cursor: nesw-resize;
    }
    .pi-window-resize-e {
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 8px;
      height: auto;
      cursor: ew-resize;
    }
    .pi-window-resize-se {
      right: 0;
      bottom: 0;
      cursor: nwse-resize;
    }
    .pi-window-resize-s {
      left: 16px;
      right: 16px;
      bottom: 0;
      width: auto;
      height: 8px;
      cursor: ns-resize;
    }
    .pi-window-resize-sw {
      left: 0;
      bottom: 0;
      cursor: nesw-resize;
    }
    .pi-window-resize-w {
      left: 0;
      top: 16px;
      bottom: 16px;
      width: 8px;
      height: auto;
      cursor: ew-resize;
    }
    .pi-window-drag-shield {
      position: absolute;
      inset: 0;
      z-index: 10000;
      pointer-events: auto;
      background: transparent;
      user-select: none;
    }
    .pi-window-drag-shield.moving {
      cursor: move;
    }
    .pi-window-drag-shield.resizing {
      cursor: nwse-resize;
    }
    .pi-window-drag-shield.resizing-n,
    .pi-window-drag-shield.resizing-s {
      cursor: ns-resize;
    }
    .pi-window-drag-shield.resizing-e,
    .pi-window-drag-shield.resizing-w {
      cursor: ew-resize;
    }
    .pi-window-drag-shield.resizing-ne,
    .pi-window-drag-shield.resizing-sw {
      cursor: nesw-resize;
    }
    .pi-window-drag-shield.resizing-nw,
    .pi-window-drag-shield.resizing-se {
      cursor: nwse-resize;
    }
  </style>
</head>
