<svg xmlns="http://www.w3.org/2000/svg">
  <!-- A trunk of two nodes with a third branching off it, on a 17-unit ink box
       centred in the 24-unit canvas, the same box as the other dataset-toolbar
       glyphs. The branch is one quarter turn of a large circle rather than a
       small elbow, so the turn is still visible at 13px. The host stylesheet
       owns the line width; only the colour is fixed here. -->
  <symbol id="dependency-graph" viewBox="0 0 24 24">
    <circle cx="6.1" cy="6.1" r="2.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="6.1" cy="17.9" r="2.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="17.9" cy="6.1" r="2.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6.1 8.5v7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17.9 8.5A9.4 9.4 0 0 1 8.5 17.9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
