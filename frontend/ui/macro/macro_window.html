<section id="macroWindow" class="host-nodrag" role="dialog" aria-label="Macros">
  <div class="macroResizeHandle macroResizeNw" data-resize-edge="nw" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeN" data-resize-edge="n" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeNe" data-resize-edge="ne" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeE" data-resize-edge="e" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeSe" data-resize-edge="se" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeS" data-resize-edge="s" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeSw" data-resize-edge="sw" aria-hidden="true"></div>
  <div class="macroResizeHandle macroResizeW" data-resize-edge="w" aria-hidden="true"></div>
  <div id="macroHeader" class="macroHeader">
    <span class="macroHeaderTitle">Macros</span>
    <span class="macroHeaderSpacer" aria-hidden="true"></span>
    <button id="macroRefreshBtn" class="macroIconBtn" type="button" title="Refresh macros" aria-label="Refresh macros">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6v5h-5"></path>
        <path d="M4 18v-5h5"></path>
        <path d="M18 9a7 7 0 0 0-11-3"></path>
        <path d="M6 15a7 7 0 0 0 11 3"></path>
      </svg>
    </button>
    <button id="macroLibraryBtn" class="macroIconBtn" type="button" title="Open shared macro library" aria-label="Open shared macro library" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </button>
    <button id="macroPinBtn" class="macroIconBtn" type="button" title="Pin macros on top" aria-label="Pin macros on top" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 17v5"></path>
        <path d="M5 17h14"></path>
        <path d="M8 3h8l-1 7 3 3v4H6v-4l3-3-1-7z"></path>
      </svg>
    </button>
    <button id="macroEditBtn" class="macroIconBtn" type="button" title="Edit macro" aria-label="Edit macro" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 20h9"></path>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
      </svg>
    </button>
    <button id="macroCloseBtn" class="macroIconBtn" type="button" title="Close" aria-label="Close macros">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 7l10 10"></path>
        <path d="M17 7L7 17"></path>
      </svg>
    </button>
  </div>
  <div class="macroBody">
    <div id="macroContent" class="macroContent">
      <div id="macroList" class="macroList" role="listbox" aria-label="Available macros"></div>
      <div id="macroSplitHandle" class="macroSplitHandle" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize macro list and description sections" title="Drag to resize sections"></div>
      <div id="macroDescription" class="macroDescription">Select a macro to view its description.</div>
    </div>
    <div class="macroFooter">
      <div id="macroStatus" class="macroStatus" aria-live="polite"></div>
      <button id="macroRunBtn" class="macroRunButton" type="button" disabled>Run</button>
    </div>
  </div>
</section>
