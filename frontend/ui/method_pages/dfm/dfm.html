    }

      min-width: 0;
      max-width: none;
      height: 30px;
      padding: 0 10px;

    }
    .dfmResultsBasisStatus.is-loading {
      color: #1d4ed8;
    }
    #resultsWrap table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      table-layout: fixed;
      font-size: var(--dfm-table-font-size);
      user-select: none;
      -webkit-user-select: none;
    }
    #resultsWrap th,
    #resultsWrap td {
      border: 0;
      border-right: 1px solid #ddd;
      border-bottom: 1px solid #ddd;
      max-width: var(--cell-max-w);
      min-width: var(--cell-min-w);
      height: var(--cell-h);
      line-height: var(--cell-h);
      padding: 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    #resultsWrap thead th {
      text-align: center;
      vertical-align: middle;
      background: #f6f6f6;
      position: sticky;
      top: 0;
      z-index: 5;
      border-top: 1px solid #ddd;
      background-clip: padding-box;
      font-weight: 400;
      height: auto;
      min-height: var(--cell-h);
      line-height: 1.2;
      padding-top: 4px;
      padding-bottom: 4px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-overflow: clip;
    }
    #resultsWrap thead { background: #f6f6f6; }
    #resultsWrap th:first-child,
    #resultsWrap td:first-child {
      text-align: center;
      font-weight: 400;
      position: sticky;
      left: 0;
      z-index: 4;
      background: #f6f6f6;
      border-left: 1px solid #ddd;
      border-right: 0;
      box-shadow: 1px 0 0 #ddd;
      width: auto;
      min-width: max-content;
      max-width: 180px;
      background-clip: padding-box;
    }
    #resultsWrap thead th:first-child {
      z-index: 6;
    }
    #resultsWrap tbody td:not(:first-child) {
      text-align: right;
    }
  </style>
</head>
