<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260811a"></script>
  <title>Development Factor Method</title>
  <link rel="stylesheet" href="/ui/shared/tabbed_page/tabbed_page.css?v=20260714a"/>
  <link rel="stylesheet" href="/ui/shared/tabs/details/details_form_layout.css?v=20260817e"/>
  <link rel="stylesheet" href="/ui/shared/tabs/notes/notes_tab.css?v=20260714a"/>
  <link rel="stylesheet" href="/ui/shared/tabs/links/links_tab.css?v=20260807a"/>
  <link rel="stylesheet" href="/ui/shared/styles/scrollbars.css?v=20260516a"/>
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/spreadsheet_table.css?v=20260811c"/>
  <link rel="stylesheet" href="/ui/shared/components/workspace/workspace.css?v=20260721a"/>
  <link rel="stylesheet" href="/ui/shared/components/pickers/picker_fields.css?v=20260715a"/>
  <link rel="stylesheet" href="/ui/shared/components/spreadsheet/numeric_stepper.css?v=20260715a"/>
  <link rel="stylesheet" href="/ui/shared/components/context_menu/context_menu.css?v=20260811b"/>
  <link rel="stylesheet" href="/ui/shared/tabs/data/data_tab.css?v=20260811c"/>
  <link rel="stylesheet" href="/ui/shared/components/formula_bar/formula_bar.css?v=20260812a"/>
  <link rel="stylesheet" href="/ui/method_pages/dfm/dfm.css?v=20260817e"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260817d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260817d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/high_contrast.css?v=20260811c"/>
</head>

<body>
  <div class="dfmTabBar tabbedPageTabBar">
    <button class="dfmTab tabbedPageTab active" data-page="details" type="button">Details</button>
    <button class="dfmTab tabbedPageTab" data-page="data" type="button">Data</button>
    <button class="dfmTab tabbedPageTab" data-page="ratios" type="button">Ratios</button>
    <button class="dfmTab tabbedPageTab" data-page="results" type="button">Results</button>
    <button class="dfmTab tabbedPageTab" data-page="notes" type="button">Notes</button>
    <button class="dfmTab tabbedPageTab" data-page="links" type="button">Links</button>
    <button class="dfmTab tabbedPageTab" data-page="audit" type="button">Audit Log</button>
  </div>
  <div id="dfmDetailsPage" class="arDetailsRoot">
    <!-- One ungrouped, evenly spaced field list: Name first, Output Type second,
         then the remaining Details fields. -->
    <div class="dfmSection">
      <div class="dfmFormGrid arDetailsGrid">
        <label class="arDetailsLabel" for="dfmMethodName">Name : </label>
        <div class="dfmFormField arDetailsField">
          <div class="dfmMethodNameWrap">
            <input id="dfmMethodName" type="text" placeholder="Enter the method name" />
            <button id="dfmMethodNameBtn" type="button" class="pathTreeBtn" title="Select DFM method name" aria-label="Select DFM method name">...</button>
            <div id="dfmMethodNameDropdown" class="datasetDropdown"></div>
          </div>
          <div id="dfmInstanceMissingNotice" class="dfmInstanceMissingNotice" aria-live="polite">
            <span id="dfmInstanceMissingText">This DFM instance has not been created, click confirm to generate it.</span>
            <button id="dfmInstanceConfirmBtn" type="button" class="dfmActionBtn">Confirm</button>
          </div>
        </div>
        <label class="arDetailsLabel" for="dfmOutputVector">Output Type : </label>
        <div class="dfmFormField arDetailsField">
          <div class="dfmOutputVectorWrap">
            <input id="dfmOutputVector" type="text" placeholder="Select output type" />
            <button id="dfmOutputVectorBtn" type="button" class="pathTreeBtn" title="Select output type" aria-label="Select output type">...</button>
            <div id="dfmOutputVectorDropdown" class="datasetDropdown"></div>
          </div>
        </div>
        <label class="arDetailsLabel" data-details-field="project" for="projectSelect">Project : </label>
        <div class="dfmFormField arDetailsField" data-details-field="project">
          <div class="projectSelectWrap">
            <input id="projectSelect" autocomplete="off" />
            <button id="projectTreeBtn" type="button" class="projectTreeBtn" title="Browse project folders" aria-label="Browse project folders">...</button>
            <div id="projectDropdown" class="projectDropdown"></div>
          </div>
        </div>
        <label class="arDetailsLabel" for="pathInput">Segment : </label>
        <div class="dfmFormField arDetailsField">
          <div class="reservingClassWrap">
            <input id="pathInput" />
            <button id="pathTreeBtn" type="button" class="pathTreeBtn" title="Browse segments" aria-label="Browse segments">...</button>
          </div>
        </div>
        <label class="arDetailsLabel" for="triInput">Input Triangle : </label>
        <div class="dfmFormField arDetailsField">
          <div class="datasetSelectWrap">
            <input id="triInput" autocomplete="off" />
            <button id="dfmTriTypeBtn" type="button" class="datasetTreeBtn" title="Select input triangle" aria-label="Select input triangle">...</button>
            <div id="datasetDropdown" class="datasetDropdown"></div>
            <div id="dfmTriTypeDropdown" class="datasetDropdown"></div>
          </div>
        </div>
      </div>
      <div class="dfmFormGrid3">
        <label class="arDetailsLabel" for="originLenSelect">Origin Length : </label>
        <div class="dfmFormField arDetailsField">
          <div class="dfmSpinner" data-target="originLenSelect">
            <select id="originLenSelect"></select>
            <div class="dfmSpinBtns">
              <button class="dfmSpinBtn up" type="button" aria-label="Increase"><span class="dfmStepperCaret dfmStepperCaretUp" aria-hidden="true"></span></button>
              <button class="dfmSpinBtn down" type="button" aria-label="Decrease"><span class="dfmStepperCaret" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
        <div class="dfmFormField arDetailsField"></div>
        <label class="arDetailsLabel" for="devLenSelect">Development Length : </label>
        <div class="dfmFormField arDetailsField">
          <div class="dfmSpinner" data-target="devLenSelect">
            <select id="devLenSelect"></select>
            <div class="dfmSpinBtns">
              <button class="dfmSpinBtn up" type="button" aria-label="Increase"><span class="dfmStepperCaret dfmStepperCaretUp" aria-hidden="true"></span></button>
              <button class="dfmSpinBtn down" type="button" aria-label="Decrease"><span class="dfmStepperCaret" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
        <div class="dfmFormField arDetailsField"></div>
        <label class="arDetailsLabel" for="decimalPlaces">Decimal Places : </label>
        <div class="dfmFormField arDetailsField">
          <div class="decimalPlacesWrap" data-dfm-spinner="decimalPlaces">
            <input id="decimalPlaces" type="number" min="0" max="6" value="4" aria-label="Decimal Places" />
            <div class="decimalPlacesStepper">
              <button class="decimalPlacesStepBtn" data-step-direction="up" type="button" aria-label="Increase Decimal Places"><span class="datasetStepperCaret datasetStepperCaretUp" aria-hidden="true"></span></button>
              <button class="decimalPlacesStepBtn" data-step-direction="down" type="button" aria-label="Decrease Decimal Places"><span class="datasetStepperCaret" aria-hidden="true"></span></button>
            </div>
          </div>
        </div>
        <div class="dfmFormField arDetailsField"></div>
      </div>
      <input id="cumulativeChk" type="checkbox" checked style="display:none;" />
      <input id="linkLenChk" type="checkbox" style="display:none;" />
      <input type="radio" name="timeMode" value="development" checked style="display:none;" />
    </div>
    <div class="dfmHiddenControls" style="display:none;">
      <button id="reloadBtn" type="button">Reload</button>
    </div>

    <div id="dfmHiddenFx" style="display:none;">
      <div class="fxbar-top small">
        <b id="cellRef">Formula</b>
        <span id="cellMeta"></span>
      </div>
      <input id="formulaBar" placeholder="" />
    </div>
  </div>
  <div id="dfmDataPage">
    <div class="panel" id="triPanel">
      <div class="panelInner">
        <div class="small" id="tableMeta" style="display:none;"></div>
        <div id="tableWrapHost">
          <div id="tableWrap"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="dfmRatiosPage">
    <div class="panel" id="ratioPanel">
      <div class="panelInner">
        <!-- <div class="small"><b>Ratios</b></div> -->
        <div id="dfmRatiosNotice" class="dfmRatiosNotice" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
        <div id="ratioWrapHost" tabindex="-1" aria-label="Ratios tables">
          <div id="ratioWrap"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="dfmResultsPage">
    <div class="panel" id="resultsPanel">
      <div class="panelInner">
        <!-- <div class="small"><b>Results</b></div> -->
        <div class="dfmResultsControls">
          <label for="dfmRatioBasisInput">Ratio Basis</label>
          <div class="dfmResultsPickerWrap">
            <input id="dfmRatioBasisInput" placeholder="None" autocomplete="off" />
            <button id="dfmRatioBasisBtn" type="button" class="pathTreeBtn" title="Browse dataset names" aria-label="Browse dataset names">...</button>
          </div>
          <label for="dfmUltimateRatioDecimalPlacesInput">Ultimate Ratio Decimals</label>
          <div class="dfmSpinner" data-target="dfmUltimateRatioDecimalPlacesInput">
            <input
              id="dfmUltimateRatioDecimalPlacesInput"
              class="dfmResultsSmallInput"
              type="number"
              min="0"
              max="6"
              value="2"
              autocomplete="off"
            />
            <div class="dfmSpinBtns">
              <button class="dfmSpinBtn up" type="button" aria-label="Increase"><span class="dfmStepperCaret dfmStepperCaretUp" aria-hidden="true"></span></button>
              <button class="dfmSpinBtn down" type="button" aria-label="Decrease"><span class="dfmStepperCaret" aria-hidden="true"></span></button>
            </div>
          </div>
          <span id="dfmRatioBasisStatus" class="dfmResultsBasisStatus" aria-live="polite"></span>
        </div>
        <div id="resultsWrap" tabindex="0" aria-label="DFM results table"></div>
      </div>
    </div>
  </div>

  <div id="dfmNotesPage"></div>

  <div id="dfmLinksPage">
    <div id="dfmLinksMount"></div>
  </div>

  <div id="dfmAuditPage">
    <div id="dfmAuditLogMount"></div>
  </div>

  <div id="dfmSaveBar" class="dfmSaveBar">
    <button id="dfmSaveBtn" class="dfmSaveBtn" type="button">Save</button>
    <button id="dfmCancelBtn" class="dfmCancelBtn" type="button">Cancel</button>
  </div>

  <div id="dfmAvgMenu" class="dfmCtxMenu">
    <button class="dfmCtxItem dfmCtxModeItem" data-action="toggle-summary-ratio-mode" data-target-mode="edit">
      <span class="dfmCtxItemLabel">Switch to Edit Mode</span>
      <svg class="dfmCtxModeIcon dfmCtxModeIconEdit" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="m3 11.8.7-3L10.9 1.6a1.2 1.2 0 0 1 1.7 0l1.8 1.8a1.2 1.2 0 0 1 0 1.7l-7.2 7.2-3 .7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="m9.9 2.7 3.4 3.4M3.7 8.8l3.5 3.5" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <svg class="dfmCtxModeIcon dfmCtxModeIconSelect" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 9.8v-7a1.2 1.2 0 0 1 2.4 0v4.8-1.7a1.15 1.15 0 0 1 2.3 0v2.2-1.4a1.15 1.15 0 0 1 2.3 0v2.2-1.3a1.15 1.15 0 0 1 2.3 0v3.6c0 2.5-1.7 4.3-4.1 4.3H8.7c-1.2 0-2.2-.5-2.9-1.4L2.9 10a1.2 1.2 0 0 1 1.8-1.6L6 9.8Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="dfmCtxSep"></div>
    <button class="dfmCtxItem" data-action="copy-summary-value">Copy value</button>
    <button class="dfmCtxItem" data-action="add-summary-cell-note">Add Cell Notes</button>
    <div class="dfmCtxSep"></div>
    <button class="dfmCtxItem" data-action="rename-average" data-label-only="1">Rename</button>
    <button class="dfmCtxItem" data-action="delete-average" data-label-only="1">Delete</button>
    <div class="dfmCtxSep" data-label-only="1"></div>
    <button class="dfmCtxItem" data-action="plot-summary-table">Plot Table Data</button>
    <div class="dfmCtxSep" data-label-only="1"></div>
    <button class="dfmCtxItem" data-action="custom-average" data-label-only="1">Custom Average</button>
  </div>
  <div id="dfmRatioMenu" class="dfmCtxMenu">
    <button class="dfmCtxItem dfmCtxModeItem" data-action="toggle-ratio-mode" data-target-mode="edit">
      <span class="dfmCtxItemLabel">Switch to Edit Mode</span>
      <svg class="dfmCtxModeIcon dfmCtxModeIconEdit" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="m3 11.8.7-3L10.9 1.6a1.2 1.2 0 0 1 1.7 0l1.8 1.8a1.2 1.2 0 0 1 0 1.7l-7.2 7.2-3 .7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="m9.9 2.7 3.4 3.4M3.7 8.8l3.5 3.5" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <svg class="dfmCtxModeIcon dfmCtxModeIconSelect" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M6 9.8v-7a1.2 1.2 0 0 1 2.4 0v4.8-1.7a1.15 1.15 0 0 1 2.3 0v2.2-1.4a1.15 1.15 0 0 1 2.3 0v2.2-1.3a1.15 1.15 0 0 1 2.3 0v3.6c0 2.5-1.7 4.3-4.1 4.3H8.7c-1.2 0-2.2-.5-2.9-1.4L2.9 10a1.2 1.2 0 0 1 1.8-1.6L6 9.8Z" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="dfmCtxItem" data-action="toggle-ratio-data">Show Data</button>
    <div class="dfmCtxSep"></div>
    <button class="dfmCtxItem" data-action="copy-ratio-value">Copy value</button>
    <button class="dfmCtxItem" data-action="add-ratio-cell-note">Add Cell Notes</button>
    <div class="dfmCtxSep"></div>
    <button class="dfmCtxItem" data-action="toggle-na-borders">Hide N/A Borders</button>
    <div class="dfmCtxSep"></div>
    <button class="dfmCtxItem" data-action="copy-ratio-patterns">Copy Ratio Patterns</button>
    <button class="dfmCtxItem" data-action="apply-ratio-patterns">Apply Ratio Patterns</button>
  </div>
  <div id="dfmAvgModal" class="dfmModal">
    <div class="dfmModalBackdrop"></div>
    <div class="dfmModalCard">
      <div class="dfmModalTitle">Custom Average</div>
      <div class="dfmModalField">
        <label for="dfmAvgName">Average Formula Name</label>
        <input id="dfmAvgName" type="text" value="User Entry" />
      </div>
      <div class="dfmModalField">
        <label for="dfmAvgType">Average Type</label>
        <select id="dfmAvgType">
          <option value="custom">Custom</option>
          <option value="user_entry">User Entry</option>
        </select>
      </div>
      <div class="dfmModalField">
        <label for="dfmAvgBase">Base Weights</label>
        <select id="dfmAvgBase">
          <option value="simple">Simple</option>
          <option value="volume">Volume</option>
        </select>
      </div>
      <div class="dfmModalField">
        <label for="dfmAvgPeriods">Periods Included</label>
        <input id="dfmAvgPeriods" type="text" inputmode="numeric" list="dfmAvgPeriodsList" placeholder="All" />
        <datalist id="dfmAvgPeriodsList">
          <option value="All"></option>
          <option value="3"></option>
          <option value="5"></option>
          <option value="8"></option>
        </datalist>
      </div>
      <div class="dfmModalField">
        <label for="dfmAvgExclude">Exclude High/Low Values</label>
        <input id="dfmAvgExclude" type="text" list="dfmAvgExcludeList" placeholder="None" />
        <datalist id="dfmAvgExcludeList">
          <option value="None"></option>
          <option value="1"></option>
          <option value="2"></option>
          <option value="3"></option>
        </datalist>
      </div>
      <div id="dfmAvgError" class="dfmModalError" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
      <div class="dfmModalActions">
        <button id="dfmAvgCancel">Cancel</button>
        <button id="dfmAvgAdd" class="primary">Add</button>
      </div>
    </div>
  </div>

  <div id="dfmRenameModal" class="dfmModal">
    <div class="dfmModalBackdrop"></div>
    <div class="dfmModalCard">
      <div class="dfmModalTitle">Rename</div>
      <div class="dfmModalField">
        <label for="dfmRenameName">Name</label>
        <input id="dfmRenameName" type="text" />
      </div>
      <div id="dfmRenameError" class="dfmModalError" role="alert" aria-live="assertive" aria-atomic="true" hidden></div>
      <div class="dfmModalActions">
        <button id="dfmRenameCancel">Cancel</button>
        <button id="dfmRenameOk" class="primary">OK</button>
      </div>
    </div>
  </div>

  <div id="dfmRatioChartModal" class="dfmModal dfmRatioChartModal">
    <div class="dfmModalBackdrop"></div>
    <div class="dfmModalCard">
      <div class="dfmRatioChartHeader">
        <div class="dfmRatioChartHeaderTitleBlock">
          <div class="dfmRatioChartTitle" id="dfmRatioChartTitle">Ratio Column</div>
          <div class="dfmRatioChartMeta" id="dfmRatioChartMeta"></div>
        </div>
        <div class="dfmRatioChartLegend" id="dfmRatioChartLegend">
          <span class="dfmChartLegendItem"><span class="dfmLegendIcon dfmLegendSelected"></span>Selected</span>
          <span class="dfmChartLegendItem"><span class="dfmLegendIcon dfmLegendNotUsed"></span>Not Used</span>
          <span class="dfmChartLegendItem"><span class="dfmLegendIcon dfmLegendExcluded">×</span>Excluded</span>
          <span class="dfmChartLegendItem dfmLegendSelectedValue" id="dfmRatioChartSelectedValue"><span class="dfmLegendDashedLine"></span></span>
        </div>
        <button class="dfmRatioChartIncludeAll" id="dfmRatioChartIncludeAll" type="button">Included All Ratios</button>
        <button class="dfmRatioChartClose" id="dfmRatioChartClose" aria-label="Close">×</button>
      </div>
      <div class="dfmRatioChartCanvasWrap">
        <canvas id="dfmRatioChartCanvas"></canvas>
        <div class="dfmRatioChartTooltip" id="dfmRatioChartTooltip"></div>
      </div>
    </div>
  </div>

  <div id="hiddenControls" style="display:none;">
    <div class="small" id="dsMeta"></div>
    <button id="saveBtn">Save</button>
    <button id="toggleBlankBtn">Show blanks</button>
    <pre id="log"></pre>
  </div>

  <div id="ctxMenu" class="ctx-menu" style="display:none;">
    <div class="ctx-menu-inner">
      <button class="ctx-item" data-action="copy_value">Copy value</button>
      <div class="ctx-sep"></div>
      <button class="ctx-item" data-action="export_data">Export data</button>
    </div>
  </div>

  <script type="module">
    (async () => {
      await import("/ui/method_pages/dfm/dfm_data_tab_adapter.js?v=20260817c");
      try {
        await window.ADA_DATASET_READY;
      } catch (err) {
        console.error("Dataset boot failed before DFM initialization:", err);
      }
      await import("/ui/method_pages/dfm/dfm_main.js?v=20260817a");
    })();
  </script>
</body>
</html>
