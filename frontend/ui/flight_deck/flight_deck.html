<section id="flightDeck" class="host-nodrag" role="toolbar" aria-label="Flight Deck" aria-orientation="horizontal" data-orientation="horizontal">
  <div id="flightDeckGrip" class="flightDeckGrip" aria-hidden="true">
    <svg viewBox="0 0 8 20" focusable="false">
      <circle cx="2.6" cy="6" r="1"></circle>
      <circle cx="5.4" cy="6" r="1"></circle>
      <circle cx="2.6" cy="10" r="1"></circle>
      <circle cx="5.4" cy="10" r="1"></circle>
      <circle cx="2.6" cy="14" r="1"></circle>
      <circle cx="5.4" cy="14" r="1"></circle>
    </svg>
  </div>
  <div id="flightDeckSlots" class="flightDeckSlots" role="group" aria-label="Macro shortcuts"></div>
  <div id="flightDeckHint" class="flightDeckHint">Drag a macro here</div>
  <div class="flightDeckDivider" aria-hidden="true"></div>
  <button id="flightDeckMenuBtn" class="flightDeckSysBtn" type="button" data-arcrho-tip="Flight Deck options" aria-label="Flight Deck options" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="5.5" r="1.5"></circle>
      <circle cx="12" cy="12" r="1.5"></circle>
      <circle cx="12" cy="18.5" r="1.5"></circle>
    </svg>
  </button>
  <button id="flightDeckCloseBtn" class="flightDeckSysBtn" type="button" data-arcrho-tip="Hide the Flight Deck (Ctrl+B)" aria-label="Hide the Flight Deck">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M7 7l10 10"></path>
      <path d="M17 7L7 17"></path>
    </svg>
  </button>
</section>
