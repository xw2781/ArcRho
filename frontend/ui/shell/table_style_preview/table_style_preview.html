<!doctype html>
<!-- A still snapshot of one table style for the Home "Color Theme" dialog. It is
     drawn from the real tab and spreadsheet stylesheets, so it shows exactly what
     a method page looks like. The style comes from ?tableStyle= and is locked, so
     the app-wide choice never repaints it; Light or Dark follows the app. -->

<head>
