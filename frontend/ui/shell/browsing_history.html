<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260811a"></script>
  <title>Browsing History</title>
  <link rel="stylesheet" href="/ui/shell/browsing_history.css?v=20260722a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260817d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260824e"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/high_contrast.css?v=20260811c"/>
</head>
<body>
  <main class="page">
    <h1 class="title">Browsing History</h1>
    <p class="subtitle">Recent pages saved to this PC for quick restore after cache reloads.</p>
    <section class="section" aria-label="Project Instances">
      <h2 class="sectionTitle">Project Instances</h2>
      <div id="projectInstanceEmpty" class="empty">No recent Project Instance records yet.</div>
      <div id="projectInstanceList" class="list" aria-label="Project Instance History List"></div>
    </section>
    <section class="section" aria-label="Recent My Workspace Paths">
      <h2 class="sectionTitle">Recent My Workspace Paths</h2>
      <div id="workspaceEmpty" class="empty">No recent My Workspace folders yet.</div>
      <div id="workspaceList" class="list" aria-label="My Workspace Folder History List"></div>
    </section>
    <section class="section" aria-label="Other">
      <h2 class="sectionTitle">Other</h2>
      <div id="historyEmpty" class="empty">No recent Dataset Viewer records yet.</div>
      <div id="historyList" class="list" aria-label="Dataset Viewer History List"></div>
    </section>
  </main>

  <script type="module" src="/ui/shell/browsing_history_main.js?v=20260726a"></script>
</body>
</html>
