<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260811a"></script>
  <title>Browsing History</title>
  <link rel="stylesheet" href="/ui/shell/browsing_history.css?v=20260828c"/>
  <link rel="stylesheet" href="/ui/shell/tab-type-icons/tab_type_icons.css?v=20260821a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260817d"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260903a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/high_contrast.css?v=20260811c"/>
</head>
<body>
  <header class="header">
    <h1 class="title">Browsing History</h1>
    <div class="headerTools">
      <div id="kindFilter" class="kindFilter" role="group" aria-label="Page Type">
        <button type="button" class="kindButton" data-kind="all" aria-pressed="true">
          <span class="kindLabel">All</span><span class="kindCount"></span>
        </button>
        <button type="button" class="kindButton" data-kind="project_instance" aria-pressed="false">
          <span class="kindLabel">Project Instances</span><span class="kindCount"></span>
        </button>
        <button type="button" class="kindButton" data-kind="file_explorer" aria-pressed="false">
          <span class="kindLabel">My Workspace Folders</span><span class="kindCount"></span>
        </button>
        <button type="button" class="kindButton" data-kind="dataset" aria-pressed="false">
          <span class="kindLabel">Datasets</span><span class="kindCount"></span>
        </button>
      </div>
    </div>
  </header>
  <main class="content">
    <div id="timeline" class="timeline" aria-label="Browsing History Timeline"></div>
    <div id="historyEmpty" class="empty" hidden>No recent pages.</div>
  </main>

  <script type="module" src="/ui/shell/browsing_history_main.js?v=20260828e"></script>
</body>
</html>
