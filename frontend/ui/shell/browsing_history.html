<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="/ui/shared/services/color_theme.js?v=20260724a"></script>
  <title>Browsing History</title>
  <link rel="stylesheet" href="/ui/shell/browsing_history.css?v=20260722a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/light.css?v=20260722a"/>
  <link rel="stylesheet" href="/ui/shared/styles/themes/dark.css?v=20260724g"/>
</head>
<body>
  <main class="page">
    <h1 class="title">Browsing History</h1>
    <p class="subtitle">Recent pages saved to this PC for quick restore after cache reloads.</p>
    <section class="section" aria-label="Restore Pages">
      <h2 class="sectionTitle">Restore Pages</h2>
      <div id="activityEmpty" class="empty">No page restore history yet.</div>
      <div id="activityList" class="list" aria-label="Page Restore History List"></div>
    </section>
    <section class="section" aria-label="Recent Dataset Views">
      <h2 class="sectionTitle">Recent Dataset Views</h2>
      <div id="historyEmpty" class="empty">No dataset browsing history yet.</div>
      <div id="historyList" class="list" aria-label="Dataset Browsing History List"></div>
    </section>
  </main>

  <script type="module" src="/ui/shell/browsing_history_main.js?v=20260521a"></script>
</body>
</html>
